name: Validate Server (Integration)

on:
  push:
    branches:
      - my-changes
  workflow_dispatch:

concurrency:
  group: validate-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: validate-server (${{ matrix.os }})
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cross-platform server smoke tests
        if: github.event_name != 'workflow_dispatch'
        run: bun test packages/server/src/__tests__/smoke.test.ts

      - name: Run full --validate-server integration suite
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CRAFT_ANTHROPIC_API_KEY }}
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: bun run apps/cli/src/index.ts --validate-server --no-spinner --timeout 180000 --workspace-dir .github/agents
