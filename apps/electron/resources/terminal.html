<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1e1e2e; overflow: hidden; }
    #terminal { height: 100%; padding: 8px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <link rel="stylesheet" href="./vendor/xterm/xterm.css">
  <script src="./vendor/xterm/xterm.js"></script>
  <script src="./vendor/xterm/addon-fit.js"></script>
  <script>
    const term = new Terminal({
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      fontSize: 13,
      lineHeight: 1.3,
      cursorBlink: true,
      theme: {
        background: '#1e1e2e',
        foreground: '#cdd6f4',
        cursor: '#f5e0dc',
        selectionBackground: '#585b7066',
      },
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // PTY output → terminal
    window.terminalAPI.onData(function(data) {
      term.write(data);
    });

    // User keystrokes → PTY
    term.onData(function(data) {
      window.terminalAPI.write(data);
    });

    // Resize → PTY
    term.onResize(function(size) {
      window.terminalAPI.resize(size.cols, size.rows);
    });

    // Window resize → refit
    window.addEventListener('resize', function() {
      fitAddon.fit();
    });

    // PTY exit → close window
    window.terminalAPI.onExit(function() {
      window.close();
    });

    // Focus terminal on click
    document.getElementById('terminal').addEventListener('click', function() {
      term.focus();
    });
  </script>
</body>
</html>
